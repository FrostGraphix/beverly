<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" fill="none" role="img" aria-label="Beverly logo (light, for dark backgrounds)">
  <!-- Mark on the left (200x230 viewport) -->
  <defs>
    <linearGradient id="lk-bodyGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcdce0"/>
    </linearGradient>
    <linearGradient id="lk-greenBowlGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="lk-greenTabGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="lk-innerCircleGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="lk-vGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="lk-ringShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- === MARK === (left side, 0..200 x range) -->
  <!-- Stem -->
  <rect x="18" y="10" width="48" height="215" rx="24" fill="url(#lk-bodyGradLight)"/>
  <!-- Light upper bowl -->
  <path d="M42 108 Q42 80 65 68 Q88 56 114 62 Q140 68 156 88 Q172 108 168 130 L66 130 Z" fill="url(#lk-bodyGradLight)"/>
  <!-- Green right bowl -->
  <path d="M66 130 L168 130 Q170 155 155 172 Q140 190 114 194 Q88 198 68 186 Q48 174 44 155 Q40 136 42 108 Q42 136 50 155 Q58 174 80 183 Q102 192 122 185 Q145 177 155 158 Q165 140 162 120 Q163 130 155 140 Q148 150 135 150 Q125 150 120 145 Q112 158 90 158 Q70 158 62 145 Q55 132 66 130" fill="url(#lk-greenBowlGradLight)"/>
  <!-- Light overlay over bowl -->
  <path d="M66 130 Q66 110 80 100 Q96 89 114 92 Q135 95 148 110 Q162 126 158 145 Q155 160 140 168 Q122 178 100 175 Q78 172 66 158 Q55 144 66 130 Z" fill="url(#lk-bodyGradLight)"/>
  <!-- White outer ring, lifted off the white body with a soft shadow -->
  <circle cx="108" cy="145" r="44" fill="#ffffff" filter="url(#lk-ringShadow)"/>
  <!-- Green inner circle -->
  <circle cx="108" cy="145" r="37" fill="url(#lk-innerCircleGradLight)"/>
  <!-- Left person -->
  <circle cx="88" cy="132" r="6" fill="white"/>
  <path d="M75 160 Q75 147 88 145 Q101 147 101 160 Z" fill="white"/>
  <!-- Center person -->
  <circle cx="108" cy="128" r="7.5" fill="white"/>
  <path d="M93 161 Q93 146 108 144 Q123 146 123 161 Z" fill="white"/>
  <!-- Right person -->
  <circle cx="128" cy="132" r="6" fill="white"/>
  <path d="M115 160 Q115 147 128 145 Q141 147 141 160 Z" fill="white"/>
  <!-- Bolt -->
  <path d="M113 136 L104 151 L110 151 L105 162 L116 146 L110 146 Z" fill="white"/>
  <!-- Green tab -->
  <path d="M55 8 L75 8 L75 42 L55 58 Z" fill="url(#lk-greenTabGradLight)"/>

  <!-- === WORDMARK === (right side, x offset ~215) -->
  <!-- B -->
  <path d="
    M 225 57 L 225 173 L 267 173
    Q 287 173 287 157 Q 287 145 273 141 Q 283 137 283 125 Q 283 101 263 101 Z
    M 241 115 L 259 115 Q 270 115 270 125 Q 270 135 259 135 L 241 135 Z
    M 241 149 L 263 149 Q 275 149 275 157 Q 275 166 263 166 L 241 166 Z
  " fill="#f4f4f6"/>

  <!-- e -->
  <path d="
    M 300 140 Q 301 158 318 158 Q 332 158 336 148 L 348 148 Q 342 166 318 166 Q 294 166 294 144 Q 294 122 318 122 Q 342 122 342 144 L 300 144 Z
    M 301 138 L 336 138 Q 334 130 318 130 Q 304 130 301 138 Z
  " fill="#f4f4f6"/>

  <!-- v — green gradient chevron -->
  <polygon points="356,124 370,124 388,156 406,124 420,124 394,166 382,166" fill="url(#lk-vGradLight)"/>

  <!-- e -->
  <path d="
    M 432 140 Q 433 158 450 158 Q 464 158 468 148 L 480 148 Q 474 166 450 166 Q 426 166 426 144 Q 426 122 450 122 Q 474 122 474 144 L 432 144 Z
    M 433 138 L 468 138 Q 466 130 450 130 Q 436 130 433 138 Z
  " fill="#f4f4f6"/>

  <!-- r -->
  <path d="
    M 490 124 L 504 124 L 504 136 Q 508 122 524 122 L 524 136 Q 506 136 504 148 L 504 166 L 490 166 Z
  " fill="#f4f4f6"/>

  <!-- l -->
  <path d="M 532 101 L 546 101 L 546 166 L 532 166 Z" fill="#f4f4f6"/>

  <!-- y -->
  <path d="
    M 556 124 L 570 124 L 588 154 L 606 124 L 620 124 L 594 170 Q 586 186 570 184 L 570 172 Q 580 174 585 166 L 580 166 Z
  " fill="#f4f4f6"/>
</svg>
