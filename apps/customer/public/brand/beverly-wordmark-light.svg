    M 82 62 Q 83 80 100 80 Q 114 80 118 70 L 130 70 Q 124 88 100 88 Q 76 88 76 66 Q 76 44 100 44 Q 124 44 124 66 L 82 66 Z
    M 83 60 L 118 60 Q 116 52 100 52 Q 86 52 83 60 Z
  " fill="#f4f4f6"/>

  <!-- v — gradient green chevron -->
  <polygon points="138,46 152,46 170,78 188,46 202,46 176,88 164,88" fill="url(#wm-vGradLight)"/>

  <!-- e -->
  <path d="
    M 212 62 Q 213 80 230 80 Q 244 80 248 70 L 260 70 Q 254 88 230 88 Q 206 88 206 66 Q 206 44 230 44 Q 254 44 254 66 L 212 66 Z
    M 213 60 L 248 60 Q 246 52 230 52 Q 216 52 213 60 Z
  " fill="#f4f4f6"/>

  <!-- r -->
  <path d="
    M 270 46 L 284 46 L 284 58 Q 288 44 304 44 L 304 58 Q 286 58 284 70 L 284 88 L 270 88 Z
  " fill="#f4f4f6"/>

  <!-- l -->
  <path d="M 312 14 L 326 14 L 326 88 L 312 88 Z" fill="#f4f4f6"/>

  <!-- y -->
  <path d="
    M 336 46 L 350 46 L 368 76 L 386 46 L 400 46 L 374 92 Q 366 108 350 106 L 350 94 Q 360 96 365 88 L 360 88 Z
  " fill="#f4f4f6"/>
</svg>
