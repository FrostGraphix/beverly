    M 10 14 L 10 86 L 52 86
    Q 72 86 72 70 Q 72 58 58 54 Q 68 50 68 38 Q 68 14 48 14 Z
    M 26 28 L 44 28 Q 55 28 55 38 Q 55 48 44 48 L 26 48 Z
    M 26 62 L 48 62 Q 60 62 60 70 Q 60 79 48 79 L 26 79 Z
  " fill="#f4f4f6"/>

  <!-- e -->
