<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" fill="none" role="img" aria-label="Beverly mark">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#2a2a2c"/>
    </linearGradient>
    <linearGradient id="greenBowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="greenTabGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="innerCircleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- The "b" body: vertical stroke going down then curving into bowl -->
  <!-- Vertical stroke (left side / stem) -->
  <rect x="18" y="10" width="48" height="215" rx="24" fill="url(#bodyGrad)"/>

  <!-- Upper dark bowl arc (top-left of the round part) -->
  <path d="
    M 42 108
    Q 42 80 65 68
    Q 88 56 114 62
    Q 140 68 156 88
    Q 172 108 168 130
    L 66 130
    Z
  " fill="url(#bodyGrad)"/>

  <!-- Green bowl arc (right/bottom of round part) -->
  <path d="
    M 66 130
    L 168 130
    Q 170 155 155 172
    Q 140 190 114 194
    Q 88 198 68 186
    Q 48 174 44 155
    Q 40 136 42 108
    Q 42 136 50 155
    Q 58 174 80 183
    Q 102 192 122 185
    Q 145 177 155 158
    Q 165 140 162 120
    Q 163 130 155 140
    Q 148 150 135 150
    Q 125 150 120 145
    Q 112 158 90 158
    Q 70 158 62 145
    Q 55 132 66 130
  " fill="url(#greenBowlGrad)"/>

  <!-- Dark overlay over top-right of bowl (the dark crescent) -->
  <path d="
    M 66 130
    Q 66 110 80 100
    Q 96 89 114 92
    Q 135 95 148 110
    Q 162 126 158 145
    Q 155 160 140 168
    Q 122 178 100 175
    Q 78 172 66 158
    Q 55 144 66 130
    Z
  " fill="url(#bodyGrad)"/>

  <!-- White outer ring of inner circle -->
  <circle cx="108" cy="145" r="44" fill="white"/>

  <!-- Green inner circle background -->
  <circle cx="108" cy="145" r="37" fill="url(#innerCircleGrad)"/>

  <!-- White people icon group -->
  <!-- Left person head -->
  <circle cx="88" cy="132" r="6" fill="white"/>
  <!-- Left person body -->
  <path d="M75 160 Q75 147 88 145 Q101 147 101 160 Z" fill="white"/>

  <!-- Center person head (bigger, in front) -->
  <circle cx="108" cy="128" r="7.5" fill="white"/>
  <!-- Center person body -->
  <path d="M93 161 Q93 146 108 144 Q123 146 123 161 Z" fill="white"/>

  <!-- Right person head -->
  <circle cx="128" cy="132" r="6" fill="white"/>
  <!-- Right person body -->
  <path d="M115 160 Q115 147 128 145 Q141 147 141 160 Z" fill="white"/>

  <!-- Lightning bolt (white) in center -->
  <path d="M 113 136 L 104 151 L 110 151 L 105 162 L 116 146 L 110 146 Z" fill="white"/>

  <!-- Green tab accent at top of stem -->
  <path d="M 55 8 L 75 8 L 75 42 L 55 58 Z" fill="url(#greenTabGrad)"/>
</svg>
