project_id = "beverly"

[auth]
site_url = "https://beverly.acoblighting.com"
additional_redirect_urls = [
  "https://beverly.acoblighting.com/**",
  "https://acob-beverly.vercel.app/**",
  "http://localhost:5173/**",
  "http://localhost:5174/**",
  "http://localhost:5175/**",
  "http://localhost:5176/**",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
