name: Production Hardening CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Build and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node runtime
        run: npm run node:verify

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Full local gate remains available as `npm test`.
      - name: Contract test suite
        run: npm test

      - name: Wallet system tests
        run: npm run test:wallet

      - name: Authentication tests
        run: npm run test:auth

      - name: Security tests
        run: npm run test:security

      - name: Security audit baseline
        run: npm run security:audit

      - name: Install browser runtime
        run: npx playwright install chromium --with-deps

      - name: Chromium QA
        run: npm run test:browser

      - name: Hardening audit
        run: npm run hardening:audit
