name: Wallet Ecosystem CI

on:
  # `labeled` is included so the `e2e` opt-in below works on an already-open
  # PR. With the default types (opened/synchronize/reopened) the label could
  # only ever take effect if it was applied before the PR was created.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]
    paths:
      - 'backend/wallet/**'
      - 'apps/admin/**'
      - 'apps/vendor/**'
      - 'apps/customer/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - '.github/workflows/wallet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'

jobs:
  # ── Wallet backend unit tests ─────────────────────────────────────────
  wallet-unit-tests:
    name: Wallet backend unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/wallet

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test -- --reporter=verbose

  # ── Frontend type checks ─────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [admin, vendor, customer]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck ${{ matrix.app }}
        run: pnpm --filter @beverly/${{ matrix.app }}-app --fail-if-no-match exec vue-tsc --noEmit

  # ── Frontend builds ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-typecheck]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Notification polling regression
        run: node --test tests/visible-polling.test.mjs

      - name: Build all apps
        run: pnpm --filter './apps/*' build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-builds
          path: |
            dist/wallet-admin
            dist/wallet-vendor
            dist/wallet-customer
          retention-days: 3

  # ── E2E tests (API layer — no browser needed) ─────────────────────────
  e2e-api:
    name: Isolated API contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [wallet-unit-tests]

    steps:
      - uses: actions/checkout@v6

      # This is a pnpm workspace: `npm ci` cannot resolve the `workspace:*`
      # dependency protocol and aborts with EUNSUPPORTEDPROTOCOL before any
      # test runs. Every other job here already installs with pnpm.
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated schema and build real API
        run: |
          cp supabase/migrations/20260520120000_staff_mfa_foundation.sql tests/ci/supabase/migrations/
          cp supabase/migrations/20260719100000_portal_session_timeouts.sql tests/ci/supabase/migrations/
          pnpm --filter @beverly/wallet-backend build

      # This is a separate disposable project, never the linked production stack.
      # CLI startup output may contain local keys: keep it off logs and artifacts.
      - name: Start isolated Supabase
        run: pnpm exec supabase start --workdir tests/ci --exclude studio,imgproxy,edge-runtime,realtime,storage,analytics,vector,meta > "$RUNNER_TEMP/supabase-ci-start.log" 2>&1
        env:
          DO_NOT_TRACK: '1'

      - name: Run real authentication and API contracts
        run: node tools/run-isolated-api-ci.cjs

      - name: Sanitized startup diagnostics
        if: failure()
        run: |
          node -e 'const fs=require("node:fs"); const p=process.env.RUNNER_TEMP+"/supabase-ci-start.log"; if(fs.existsSync(p)){const lines=fs.readFileSync(p,"utf8").split(/\r?\n/).filter(x=>/error|failed|timeout|invalid|unknown/i.test(x)); console.log(lines.slice(-15).join("\n").replace(/:\/\/[^\s/@]+:[^\s/@]+@/g,"://[redacted]@").replace(/[A-Za-z0-9_-]{20,}/g,"[redacted]"));}'

      - name: Remove disposable test stack
        if: always()
        run: pnpm exec supabase stop --workdir tests/ci --no-backup

  # ── Acceptance criteria checklist ────────────────────────────────────
  acceptance-criteria:
    name: Acceptance criteria structural check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [wallet-unit-tests, frontend-typecheck]

    steps:
      - uses: actions/checkout@v6

      - name: Verify wallet backend has vitest config
        run: test -f backend/wallet/vitest.config.ts

      - name: Verify all 6 runbooks exist
        run: |
          test -f docs/runbooks/gateway-outage.md
          test -f docs/runbooks/ledger-mismatch.md
          test -f docs/runbooks/token-engine-degraded.md
          test -f docs/runbooks/database-failover.md
          test -f docs/runbooks/mass-refund.md
          test -f docs/runbooks/security-incident.md

      - name: Verify E2E test files exist
        run: |
          test -f tests/e2e/admin-auth.spec.ts
          test -f tests/e2e/customer-purchase-flow.spec.ts
          test -f tests/e2e/vendor-vending-flow.spec.ts
          test -f tests/e2e/ledger-integrity.spec.ts

      - name: Verify wallet sidebar is super-admin only
        run: |
          grep -q '"super-admin"' src/data/route-manifest.js
          # Ensure wallet entry only has super-admin (not account/finance-checker)
          node -e "
            const { routeManifest } = require('./src/data/route-manifest.js');
            const wallet = routeManifest.find(r => r.group === 'Wallet');
            if (!wallet) throw new Error('Wallet entry missing');
            const roles = wallet.roles;
            if (roles.length !== 1 || roles[0] !== 'super-admin') {
              throw new Error('Wallet must be restricted to super-admin only. Got: ' + JSON.stringify(roles));
            }
            console.log('OK: Wallet entry is super-admin only');
          "

      - name: Verify auth plugin uses getUser (not JWT secret)
        run: |
          grep -q "getUser" backend/wallet/src/plugins/auth.ts
          ! grep -q "fastify.jwt.verify\|verifyJwt" backend/wallet/src/plugins/auth.ts
          echo "OK: auth plugin uses adminClient.auth.getUser()"
