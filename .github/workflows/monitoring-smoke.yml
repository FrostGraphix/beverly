name: Monitoring Smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Override target URL"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview-smoke:
    name: Preview smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.PREVIEW_TARGET_URL != '' || github.event.inputs.target_url != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run preview smoke
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || vars.PREVIEW_TARGET_URL }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: npm run smoke:vercel

  production-uptime:
    name: Production uptime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.PRODUCTION_TARGET_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production smoke
        env:
          TARGET_URL: ${{ vars.PRODUCTION_TARGET_URL }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: npm run smoke:vercel
