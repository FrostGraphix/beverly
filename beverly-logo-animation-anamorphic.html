<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beverly — Anamorphic Energy Reveal (Restored)</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root {
  --beverly-green: #2FC34A;
  --near-black: #020403;
  --clean-white: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--near-black); color: var(--clean-white); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; perspective: 1200px; }

/* Cinematic Background Overlays */
.vignette { position: fixed; inset: 0; box-shadow: inset 0 0 350px #000; pointer-events: none; z-index: 100; }
.grid-floor { position: absolute; width: 200vw; height: 200vh; top: 30%; background-image: linear-gradient(rgba(47,195,74,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(47,195,74,0.08) 1px, transparent 1px); background-size: 60px 60px; transform: rotateX(75deg); transform-origin: center top; pointer-events: none; opacity: 0; }

/* 3D Horizon Grid Flare */
#horizon-light { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 2px; background: rgba(255,255,255,0.9); box-shadow: 0 0 50px var(--beverly-green), 0 0 100px var(--beverly-green); opacity: 0; z-index: 5; }

/* Canvas for Energy Particle Convergence */
#energy-canvas { position: absolute; inset: 0; z-index: 2; }

/* Main Stage / 3D Rig */
#stage { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transform-style: preserve-3d; }

/* HUD Target Reticle Frame */
.hud-corner { position: absolute; width: 25px; height: 25px; border: 2px solid var(--beverly-green); opacity: 0; transition: opacity 0.3s; z-index: 20; }
.hud-tl { top: -20px; left: -20px; border-right: none; border-bottom: none; }
.hud-tr { top: -20px; right: -20px; border-left: none; border-bottom: none; }
.hud-bl { bottom: -20px; left: -20px; border-right: none; border-top: none; }
.hud-br { bottom: -20px; right: -20px; border-left: none; border-top: none; }

/* Logo Container */
#logo-box { position: relative; padding: 30px; transform-style: preserve-3d; }
#logo-img { width: 550px; display: block; opacity: 0; filter: drop-shadow(0 0 0px transparent); transform: translateZ(-200px) rotateX(25deg); will-change: transform, opacity, filter; }

/* Tagline Lockup Box */
#tagline-box { margin-top: 35px; opacity: 0; transform: translateY(20px); text-align: center; }
#tagline-text { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800; color: var(--beverly-green); letter-spacing: 6px; text-transform: uppercase; background: rgba(47,195,74,0.06); padding: 12px 28px; border: 1px solid rgba(47,195,74,0.3); border-radius: 4px; box-shadow: 0 0 30px rgba(47,195,74,0.15); display: inline-block; }

/* Replay Button */
#replay-btn { position: fixed; bottom: 30px; background: rgba(5,10,7,0.8); border: 1px solid #222; color: #888; padding: 12px 24px; font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 2px; cursor: pointer; z-index: 200; border-radius: 4px; transition: 0.3s; }
#replay-btn:hover { border-color: var(--beverly-green); color: var(--beverly-green); box-shadow: 0 0 20px rgba(47,195,74,0.3); }
</style>
</head>
<body>

<div class="vignette"></div>
<div class="grid-floor" id="grid"></div>
<div id="horizon-light"></div>
<canvas id="energy-canvas"></canvas>

<div id="stage">
  <div id="logo-box">
    <!-- HUD Reticles -->
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>

    <img src="beverly-logo.png" id="logo-img" alt="Beverly Logo">
  </div>

  <div id="tagline-box">
    <span id="tagline-text">_</span>
  </div>
</div>

<button id="replay-btn" onclick="runReveal()">[ REPLAY REVEAL ]</button>

<script>
const canvas = document.getElementById('energy-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let converging = false;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

class EnergyParticle {
  constructor() { this.reset(); }
  reset() {
    let angle = Math.random() * Math.PI * 2;
    let dist = Math.random() * 600 + 400;
    this.x = canvas.width/2 + Math.cos(angle) * dist;
    this.y = canvas.height/2 + Math.sin(angle) * dist;
    this.targetX = canvas.width/2;
    this.targetY = canvas.height/2;
    this.speed = Math.random() * 0.05 + 0.02;
    this.size = Math.random() * 3 + 1;
    this.color = Math.random() > 0.3 ? '#2FC34A' : '#FFFFFF';
    this.alpha = Math.random() * 0.8 + 0.2;
  }
  update() {
    if(converging) {
      this.x += (this.targetX - this.x) * this.speed * 1.5;
      this.y += (this.targetY - this.y) * this.speed * 1.5;
    }
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.alpha;
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

for(let i=0; i<120; i++) particles.push(new EnergyParticle());

function renderCanvas() {
  ctx.fillStyle = 'rgba(2, 4, 3, 0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(renderCanvas);
}
renderCanvas();

let masterTL;

function runReveal() {
  if(masterTL) masterTL.kill();
  particles.forEach(p => p.reset());
  converging = false;
  
  masterTL = gsap.timeline();

  gsap.set('#logo-img', { opacity: 0, z: -300, rotateX: 35, filter: 'blur(30px) brightness(0%)' });
  gsap.set('.grid-floor', { opacity: 0 });
  gsap.set('#horizon-light', { opacity: 0, scaleX: 0 });
  gsap.set('.hud-corner', { opacity: 0 });
  gsap.set('#tagline-box', { opacity: 0, y: 20 });
  document.getElementById('tagline-text').innerText = '_';

  masterTL.call(() => { converging = true; }, null, 0.2);
  masterTL.to('#grid', { opacity: 0.6, duration: 1.5, ease: "power2.out" }, 0.5);

  masterTL.to('#horizon-light', { opacity: 1, scaleX: 1, duration: 0.2, ease: "power4.out" }, 1.2);
  masterTL.to('#horizon-light', { scaleY: 40, opacity: 0, filter: 'blur(15px)', duration: 0.5, ease: "expo.out" }, 1.4);

  masterTL.to('#logo-img', {
    opacity: 1, z: 0, rotateX: 0,
    filter: 'blur(0px) brightness(100%) drop-shadow(0 20px 50px rgba(47,195,74,0.5))',
    duration: 1.0, ease: "expo.out"
  }, 1.3);

  masterTL.to('.hud-corner', { opacity: 1, duration: 0.2, stagger: 0.05 }, 1.8);
  masterTL.to('#tagline-box', { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.0);
  
  const text = "YOUR SMART POWER PARTNER!";
  masterTL.to({}, {
    duration: 1.0, ease: "steps(25)",
    onUpdate: function() {
      const currentLength = Math.floor(this.progress() * text.length);
      document.getElementById('tagline-text').innerText = text.substring(0, currentLength) + (currentLength === text.length ? '' : '_');
    }
  }, 2.2);

  masterTL.to('#logo-img', {
    y: -8, rotateY: 4, duration: 3.5, ease: "sine.inOut", yoyo: true, repeat: -1
  }, 3.5);
}

window.onload = runReveal;
</script>
</body>
</html>
