      const next = new Set(current);
      const isCurrentlyChecked = next.has(facility.name);
      
      if (isCurrentlyChecked) {
        next.delete(facility.name);
        setCheckedShots((prev) => {
          const nextShots = new Set(prev);
          facility.shots.forEach((shot) => {
            nextShots.delete(`${facility.name}-${shot}`);
          });
          return nextShots;
        });
      } else {
        next.add(facility.name);
        setCheckedShots((prev) => {
          const nextShots = new Set(prev);
          facility.shots.forEach((shot) => {
            nextShots.add(`${facility.name}-${shot}`);
          });
          return nextShots;
        });
      }
      return next;
    });
  }

  function toggleShot(facilityName, shot) {
    setCheckedShots((current) => {
      const next = new Set(current);
      const shotKey = `${facilityName}-${shot}`;
      if (next.has(shotKey)) {
        next.delete(shotKey);
      } else {
        next.add(shotKey);
      }
      
      const facility = facilities.find(f => f.name === facilityName);
      if (facility) {
        const allShotsChecked = facility.shots.every(s => next.has(`${facilityName}-${s}`));
        setChecked((prevChecked) => {
          const nextChecked = new Set(prevChecked);
          if (allShotsChecked) {
            nextChecked.add(facilityName);
          } else {
            nextChecked.delete(facilityName);
          }
          return nextChecked;
        });
      }
      return next;
    });
  }

  return (

            <small>{progressMode === "facilities" ? "facility prep" : "shots captured"}</small>

      <section className="kpiStrip" aria-label="Trip summary">

      <section className="wrap">
        <div>
          <p className="label">Route logic</p>
          <h2>Kaduna south to Ikara, Kano metro, Kano north, then Jigawa west to east.</h2>

        <blockquote>When healthcare needed power most, light became part of the response.</blockquote>
      </section>
    </main>

/* Phases Layout - Mobile Base */
.phaseContainer {
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.02);
}

.phaseHeader {
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 2px solid rgba(22, 163, 92, 0.1);
  padding-bottom: 12px;
  margin: 0;
}

.phaseNumber {
  background: var(--primary);
  color: #ffffff;
  font-weight: 800;
  font-size: 10px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  text-transform: uppercase;
  letter-spacing: 1px;
  flex-shrink: 0;
}

.phaseHeader h2 {
  font-size: 18px;
  font-weight: 800;
  color: #0f172a;
  margin: 0;
}

.phaseDesc {
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.5;
  margin: -4px 0 4px;
  max-width: 100%;
}

.phaseContent {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Phase 1: Pre-Production & Field Readiness - Mobile Base */
.fieldReadiness {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.fieldReadiness article {
  padding: 16px;
}

.packingProgressBar {
  width: 100%;
  height: 6px;
  background: rgba(0, 0, 0, 0.05);
  border-radius: 3px;
  overflow: hidden;
  margin: 8px 0 12px;
}

.packingProgressBar .progressFill {
  height: 100%;
  background: var(--primary);
  transition: width 0.3s ease;
}

.kitGroups {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}

.kitGroup {
  display: grid;
  gap: 8px;
  border-radius: var(--radius-md);
  padding: 12px;
  background: rgba(240, 253, 244, 0.4);
  border: 1px solid rgba(22, 163, 92, 0.08);
}

.kitGroup strong {
  color: #0f172a;
  font-size: 13px;
}

.kitGroup div {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.kitGroup span.kitItem {
  border-radius: 20px;
  padding: 6px 12px;
  color: #15803d;
  background: rgba(22, 163, 92, 0.05);
  border: 1px solid rgba(22, 163, 92, 0.15);
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
  cursor: pointer;
}

.kitGroup span.kitItem:hover {
  background: rgba(22, 163, 92, 0.1);
  box-shadow: var(--accent-glow);
  transform: translateY(-2px);
}

.kitGroup span.kitItem.packed {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
  text-decoration: line-through;
  opacity: 0.85;
}

.safetyList {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}

.safetyList label {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border-radius: var(--radius-sm);
  padding: 12px;
  color: #334155;
  background: rgba(240, 253, 244, 0.4);
  border: 1px solid rgba(22, 163, 92, 0.08);
  cursor: pointer;
  transition: all 0.2s ease;
}

.safetyList label:hover {
  background: rgba(22, 163, 92, 0.05);
  border-color: rgba(22, 163, 92, 0.15);
}

.safetyList label.isChecked {
  background: rgba(22, 163, 92, 0.08);
  border-color: rgba(22, 163, 92, 0.25);
  color: #15803d;
  font-weight: 600;
}

.safetyList input {
  margin-top: 3px;
  accent-color: var(--primary);
  width: 14px;
  height: 14px;
  cursor: pointer;
}

.backupList {
  margin: 16px 0 0;
  padding-left: 20px;
  color: #334155;
  line-height: 1.6;
  font-size: 13px;
}

.backupList li::marker {
  color: var(--text-accent);
  font-weight: bold;
}

.backupList li + li {
  margin-top: 8px;
}

.productionGrid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.productionGrid article {
  padding: 16px;
}

.interviewList {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}

.interviewList div {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: rgba(240, 253, 244, 0.4);
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1px solid rgba(22, 163, 92, 0.08);
}

.interviewList span {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--text-accent);
  box-shadow: var(--accent-glow);
}

.interviewList p {
  margin: 0;
  color: #334155;
  line-height: 1.5;
  font-size: 13px;
}

.callout {
  margin-top: 20px;
  border: 1px solid rgba(247, 201, 72, 0.4);
  border-radius: var(--radius-md);
  padding: 16px;
  background: rgba(247, 201, 72, 0.08);
}

.callout strong {
  color: #b45309;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.callout strong::before {
  content: '⚠️';
}

.callout p {
  margin: 8px 0 0;
  color: #78350f;
  line-height: 1.5;
  font-size: 13px;
}

.deliverableWall {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.deliverables {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.deliverables span {
  border-radius: 20px;
  padding: 6px 12px;
  background: rgba(247, 201, 72, 0.06);
  color: #b45309;
  border: 1px solid rgba(247, 201, 72, 0.25);
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
}

.deliverables span:hover {
  background: rgba(247, 201, 72, 0.12);
  box-shadow: 0 0 20px rgba(247, 201, 72, 0.1);
  transform: translateY(-2px);
}

/* Phase 2: Route Itinerary & Schedule - Mobile Base */
.routeRibbon {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.routeRibbon h2 {
  font-size: 20px;
}

.routeRibbon p:not(.label) {
  margin: 8px 0 0;
  color: var(--text-muted);
  line-height: 1.5;
  font-size: 13px;
}

.routeStops {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.routeStops span {
  border: 1px solid rgba(22, 163, 92, 0.2);
  border-radius: 20px;
  padding: 6px 12px;
  color: #15803d;
  background: rgba(22, 163, 92, 0.05);
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
}

.routeStops span.isActiveStop {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 0 15px rgba(22, 163, 92, 0.4);
  transform: scale(1.05);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pulseDot {
  width: 6px;
  height: 6px;
  background: #ffffff;
  border-radius: 50%;
  animation: pulseStop 1.5s infinite;
}

@keyframes pulseStop {
  0% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 0.8; }
}

.routeStops i {
  width: 12px;
  height: 2px;
  background: rgba(22, 163, 92, 0.15);
}

.routeStops i.isActiveLink {
  background: var(--primary);
}

.workspace {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.dayRail {
  padding: 12px;
  position: static;
}

.railHead {
  display: flex;
  justify-content: space-between;
  padding: 8px 12px;
  color: #0f172a;
  font-size: 16px;
  font-weight: 700;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 12px;
}

.railHead span {
  color: var(--text-accent);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
}

.dayButton {
  display: grid;
  width: 100%;
  gap: 4px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  padding: 12px;
  color: var(--text-muted);
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: all 0.3s ease;
}

.dayButton:hover {
  background: rgba(22, 163, 92, 0.03);
  transform: translateX(4px);
}

.dayButton.isActive {
  background: rgba(22, 163, 92, 0.08);
  border-color: rgba(22, 163, 92, 0.25);
  color: #0f172a;
  box-shadow: inset 4px 0 0 var(--text-accent);
}

.dayButton span {
  color: var(--text-accent);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.dayButton strong {
  font-size: 13px;
  line-height: 1.3;
}

.detailPanel {
  padding: 16px;
}

.panelTop {
  display: grid;
  gap: 8px;
}

.panelTop h2 {
  font-size: 20px;
}

.panelTop span {
  color: var(--text-muted);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.panelTop span::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-accent);
}

.directionBlock {
  margin-top: 16px;
  border-radius: var(--radius-md);
  padding: 16px;
  background: rgba(22, 163, 92, 0.04);
  border: 1px solid rgba(22, 163, 92, 0.1);
}

.directionBlock strong {
  color: var(--text-accent);
  font-size: 12px;
  text-transform: uppercase;
}

.directionBlock p {
  margin: 8px 0 0;
  color: #334155;
  line-height: 1.5;
  font-size: 13px;
}

.workGrid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 16px;
}

.workItem {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px;
  background: rgba(240, 253, 244, 0.4);
}

.workItem span {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  margin-top: 4px;
  border-radius: 50%;
  background: var(--text-accent);
}

.workItem p {
  margin: 0;
  color: #334155;
  line-height: 1.4;
  font-size: 13px;
}

/* Phase 3: On-Site Execution - Mobile Base */
.facilitySection {
  display: flex;
  flex-direction: column;
}

.sectionHead {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 16px;
}

.sectionHead h2 {
  font-size: 20px;
}

.searchAndFilter {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.searchWrapper {
  position: relative;
  display: flex;
  align-items: center;
  background: rgba(240, 253, 244, 0.4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0 12px;
  min-height: 44px;
  width: 100%;
}

.searchWrapper:focus-within {
  border-color: var(--primary);
  background: #ffffff;
}

.searchIcon {
  color: var(--text-muted);
  margin-right: 6px;
  flex-shrink: 0;
}

.searchInput {
  border: 0;
  background: transparent;
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  width: 100%;
  outline: none;
}

.clearSearch {
  border: 0;
  background: transparent;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
}

.tabs {
  display: flex;
  gap: 4px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 4px;
  background: rgba(240, 253, 244, 0.4);
  overflow-x: auto;
  width: 100%;
}

.tabs button {
  min-height: 36px;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 0 12px;
  color: var(--text-muted);
  background: transparent;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  flex: 1 0 auto;
}

.tabs button.isActive {
  background: var(--text-accent);
  color: #ffffff;
}

.facilityList {
  display: grid;
  gap: 12px;
}

.facility {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 16px;
  border: 1px solid var(--border-subtle);
}

.facility.isChecked {
  background: linear-gradient(180deg, rgba(22, 163, 92, 0.04), #ffffff);
  border-color: rgba(22, 163, 92, 0.2);
}

.check {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border: 2px solid rgba(22, 163, 92, 0.3);
  border-radius: var(--radius-md);
  color: transparent;
  background: rgba(240, 253, 244, 0.4);
  cursor: pointer;
  transition: all 0.3s ease;
}

.check:hover {
  border-color: var(--text-accent);
}

.isChecked .check {
  background: var(--text-accent);
  border-color: var(--text-accent);
  color: #ffffff;
}

.check span {
  font-size: 12px;
  font-weight: 800;
}

.facilityMain {
  display: flex;
  flex-direction: column;
}

.facilityTitle {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.facilityTitle > span {
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  color: #ffffff;
  background: var(--text-accent);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.facilityTitle h3 {
  margin: 0;
  color: #0f172a;
  font-size: 18px;
  font-weight: 700;
}

.facilityTitle p {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 13px;
}

.facilityMeta {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin: 16px 0 0;
}

.facilityMeta dt {
  color: var(--text-accent);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.facilityMeta dd {
  margin: 4px 0 0;
  color: #334155;
  line-height: 1.4;
  font-size: 13px;
}

.shotList {
  display: grid;
  align-content: start;
  gap: 8px;
  border-top: 1px solid var(--border-subtle);
  padding-top: 16px;
}

.shotList strong {
  color: #0f172a;
  font-size: 12px;
  text-transform: uppercase;
}

.shotCheckLabel {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: #334155;
  background: rgba(240, 253, 244, 0.4);
  border: 1px solid rgba(22, 163, 92, 0.08);
  font-size: 12px;
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.shotCheckLabel:hover {
  background: rgba(22, 163, 92, 0.05);
  border-color: rgba(22, 163, 92, 0.2);
}

.shotCheckLabel.checked {
  background: rgba(22, 163, 92, 0.08);
  border-color: rgba(22, 163, 92, 0.25);
  color: #15803d;
  font-weight: 600;
}

.shotCheckLabel input {
  margin-top: 2px;
  accent-color: var(--primary);
  width: 14px;
  height: 14px;
  cursor: pointer;
}

/* Phase 4: Reference Guide - Mobile Base */
.creativeOps {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.creativeOps article {
  padding: 16px;
}

.captureGrid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 16px;
}

.captureGrid label {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border-radius: var(--radius-sm);
  padding: 12px;
  color: #334155;
  background: rgba(240, 253, 244, 0.4);
  border: 1px solid rgba(22, 163, 92, 0.08);
  cursor: pointer;
}

.captureGrid input {
  margin-top: 3px;
  accent-color: var(--primary);
  width: 14px;
  height: 14px;
}

.captureGrid label.isChecked {
  background: rgba(22, 163, 92, 0.08);
  border-color: rgba(22, 163, 92, 0.25);
  color: #15803d;
  font-weight: 600;
}

.questionStack {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}

.questionStack details {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: rgba(240, 253, 244, 0.4);
  overflow: hidden;
}

.questionStack details[open] {
  background: rgba(22, 163, 92, 0.05);
  border-color: rgba(22, 163, 92, 0.2);
}

.questionStack summary {
  cursor: pointer;
  padding: 12px 16px;
  color: #0f172a;
  font-weight: 600;
  font-size: 14px;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.questionStack summary::-webkit-details-marker {
  display: none;
}
.questionStack summary::after {
  content: '+';
  color: var(--text-accent);
  font-size: 16px;
}
.questionStack details[open] summary::after {
  content: '-';
}

.questionStack ol {
  margin: 0;
  padding: 0 16px 16px 28px;
  color: var(--text-muted);
  line-height: 1.5;
  font-size: 13px;
}

.questionStack li + li {
  margin-top: 8px;
}

/* Wrap-up - Mobile Base */
.wrap {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  padding: 16px;
}

.wrap h2 {
  font-size: 20px;
}

.wrap > p {
  margin: 0;
  color: #334155;
  line-height: 1.6;
  font-size: 13px;
}

.sourceNote {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid var(--border-subtle);
  padding-top: 16px;
}

.sourceNote span {
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  color: var(--text-muted);
  background: rgba(240, 253, 244, 0.4);
  font-size: 11px;
  border: 1px solid rgba(22, 163, 92, 0.08);
}

.wrap blockquote {
  margin: 12px 0 0;
  border-radius: var(--radius-lg);
  padding: 20px;
  color: #15803d;
  background: linear-gradient(135deg, rgba(247, 201, 72, 0.08), rgba(22, 163, 92, 0.08));
  border: 1px solid rgba(22, 163, 92, 0.15);
  font-size: 18px;
  font-weight: 800;
  line-height: 1.3;
  text-align: center;
}

/* ==========================================
   PROGRESSIVE ENHANCEMENT: Tablet Queries
   ========================================== */
@media (min-width: 768px) {
  .acob-travel {
    padding: 24px;
    gap: 24px;
  }

  .hero {
    padding: 32px;
  }

  h1 {
    font-size: 44px;
  }

  .lead {
    font-size: 16px;
  }

  .heroLogo img {
    height: 40px;
  }

  .kpiStrip {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .kpi {
    padding: 20px;
  }

  .kpi strong {
    font-size: 24px;
  }

  .phaseContainer {
    padding: 24px;
    gap: 20px;
  }

  .phaseHeader h2 {
    font-size: 22px;
  }

  .phaseDesc {
    font-size: 14px;
  }

  .fieldReadiness {
    grid-template-columns: repeat(2, 1fr);
  }

  .fieldReadiness article:last-child {
    grid-column: span 2;
  }

  .productionGrid {
    grid-template-columns: repeat(2, 1fr);
  }

  .productionGrid article:last-child {
    grid-column: span 2;
  }

  .routeRibbon {
    padding: 24px;
  }

  .routeRibbon h2 {
    font-size: 24px;
  }

  .routeStops span {
    font-size: 13px;
  }

  .workspace {
    grid-template-columns: 260px 1fr;
  }

  .dayRail {
    position: sticky;
    top: 24px;
    align-self: start;
  }

  .detailPanel {
    padding: 24px;
  }

  .panelTop h2 {
    font-size: 24px;
  }

  .workGrid {
    grid-template-columns: repeat(2, 1fr);
  }

  .sectionHead {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .searchAndFilter {
    flex-direction: row;
    align-items: center;
    width: auto;
  }

  .searchWrapper {
    width: 250px;
  }

  .tabs {
    width: auto;
  }

  .facility {
    grid-template-columns: 56px 1fr;
  }

  .shotList {
    grid-column: 2;
  }

  .creativeOps {
    grid-template-columns: repeat(2, 1fr);
  }

  .captureGrid {
    grid-template-columns: repeat(2, 1fr);
  }

  .wrap {
    padding: 24px;
  }

  .wrap h2 {
    font-size: 24px;
  }

  .sourceNote {
    flex-direction: row;
  }

  .wrap blockquote {
    font-size: 22px;
    padding: 24px;
  }
}

/* ==========================================
   PROGRESSIVE ENHANCEMENT: Desktop Queries
   ========================================== */
@media (min-width: 1200px) {
  .acob-travel {
    padding: 32px;
    gap: 32px;
  }

  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    min-height: 500px;
    padding: 48px;
  }

  h1 {
    font-size: 60px;
  }

  .lead {
    font-size: 18px;
    margin-top: 24px;
  }

  .heroCopy {
    align-self: center;
  }

  .heroLogo {
    grid-column: 1 / -1;
  }

  .heroLogo img {
    height: 48px;
  }

    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script type="module">
      import React from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

      const root = createRoot(document.getElementById("root"));
      const loadStatus = document.getElementById("load-status");
      const downloadBtn = document.getElementById("download-btn");
      const viewCodeBtn = document.getElementById("view-code-btn");
      const codeViewer = document.getElementById("code-viewer");
      const closeCodeBtn = document.getElementById("close-code-btn");
      const codeDisplay = document.getElementById("code-display");
      const copyBtn = document.getElementById("copy-btn");

      let source = "";
      let loadMethod = "";

      // Try fetching from the server (local HTTP or Vite)
      try {
        if (window.location.protocol === "file:") {
          throw new Error("Local file protocol - fetch disabled due to CORS");
        }
        
        const response = await fetch('./acob-travel-checklist.jsx?v=' + Date.now());
        if (!response.ok) {
          throw new Error('HTTP error! status: ' + response.status);
        }
        const text = await response.text();
        
        // Simple sanity check: does it look like our JSX code (e.g. contains the main component export)?
        if (text.includes("ACOBTravelChecklist")) {
          source = text;
          loadMethod = "Server (acob-travel-checklist.jsx)";
        } else {
          throw new Error("Fetched file contents are invalid (may be compiled JS/HTML)");
        }
      } catch (error) {
        console.warn("Could not load external JSX, using embedded fallback:", error);
        const fallbackScript = document.getElementById("embedded-jsx-source");
        if (fallbackScript) {
          source = fallbackScript.textContent;
          loadMethod = "Embedded Fallback";
        } else {
          loadMethod = "Failed to load";
        }
      }

      if (source) {
        // Update status badge
        loadStatus.textContent = 'Source: ' + loadMethod;
        loadStatus.className = 'status-badge ' + (loadMethod.toLowerCase().includes("server") ? "success" : "warning");

        // Setup download link
        const blob = new Blob([source], { type: "text/javascript" });
        const downloadUrl = URL.createObjectURL(blob);
        downloadBtn.href = downloadUrl;
        downloadBtn.download = "acob-travel-checklist.jsx";

        // Setup code viewer
        codeDisplay.textContent = source;

        // Compile and render component
        try {
          const transformed = Babel.transform(
            source
              .replace('import React from "react";', "")
              .replace("export default function ACOBTravelChecklist()", "function ACOBTravelChecklist()"),
            {
              presets: [["react", { runtime: "classic" }]],
            },
          ).code;

          const componentFactory = new Function("React", transformed + "; return ACOBTravelChecklist;");
          const ACOBTravelChecklist = componentFactory(React);
          root.render(React.createElement(ACOBTravelChecklist));
        } catch (compileError) {
          console.error("Compilation error:", compileError);
          document.getElementById("root").innerHTML = `
            <div class="boot error">
              <h2>Failed to compile JSX</h2>
              <pre>${compileError.message}</pre>
            </div>
          `;
        }
      } else {
        loadStatus.textContent = "Error: No source loaded";
        loadStatus.className = "status-badge error";
        document.getElementById("root").innerHTML = `
          <div class="boot error">
            <h2>Failed to load JSX</h2>
            <p>Make sure the acob-travel-checklist.jsx file exists next to the preview.html.</p>
          </div>
        `;
      }

      // Code Viewer Interactions
      viewCodeBtn.addEventListener("click", () => {
        codeViewer.style.display = "grid";
        setTimeout(() => codeViewer.classList.add("active"), 10);
      });

      const closeCode = () => {
        codeViewer.classList.remove("active");
        setTimeout(() => codeViewer.style.display = "none", 300);
      };

      closeCodeBtn.addEventListener("click", closeCode);
      codeViewer.addEventListener("click", (e) => {
        if (e.target === codeViewer) closeCode();
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(source).then(() => {
          copyBtn.textContent = "Copied!";
          setTimeout(() => {
            copyBtn.textContent = "Copy Code";
          }, 2000);
        });
      });
    </script>
  </body>
